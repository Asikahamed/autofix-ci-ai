name: AI Autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      !contains(github.event.workflow_run.head_branch, 'autofix')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.CREATOR_BOT_TOKEN }}

      - name: Download failure logs via API
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
          -n failure-logs \
          -D .
        env:
          GH_TOKEN: ${{ secrets.CREATOR_BOT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI fix (Hugging Face FREE)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/autofix.py pytest.log

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CREATOR_BOT_TOKEN }}
          branch: autofix-${{ github.run_id }}
          base: ${{ github.event.workflow_run.head_branch }}
          title: "AI Autofix: Resolve CI Failure"
          body: "Automated minimal fix generated from CI logs."

      - name: Auto approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.APPROVE_BOT_TOKEN }}
          pull-request-number: ${{ steps.pr.outputs.pull-request-number }}

      - name: Merge PR
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --merge --delete-branch --admin
        env:
          GH_TOKEN: ${{ secrets.APPROVE_BOT_TOKEN }}


