name: AI Autofix

# Triggered after CI workflow completes
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    # Run only if CI failed and not already on an autofix branch
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      !contains(github.event.workflow_run.head_branch, 'autofix')
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo at the head commit of CI run
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.CREATOR_BOT_TOKEN }}
          fetch-depth: 0

      # 2️⃣ Create a dedicated autofix branch
      - name: Create Autofix Branch
        run: git checkout -b autofix-${{ github.run_id }}

      # 3️⃣ Prepare logs folder
      - name: Prepare logs folder
        run: |
          mkdir -p ./logs
          rm -f ./logs/*

      # 4️⃣ Download the CI log artifact
      - name: Download CI logs
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
            -n failure-logs \
            -D ./logs
        env:
          GH_TOKEN: ${{ secrets.CREATOR_BOT_TOKEN }}

      # 5️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 6️⃣ Install project dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 7️⃣ Run AI autofix script with unified CI log
      - name: Generate AI fix (Hugging Face)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/autofix.py ./logs/ci.log

      # 8️⃣ Commit AI-generated changes (if any)
      - name: Commit AI patch
        run: |
          git config user.name "CI Autofix Bot"
          git config user.email "ci-bot@example.com"
          git add .
          git diff --cached --quiet || git commit -m "Autofix: Apply AI suggested patch"
          git push origin HEAD:autofix-${{ github.run_id }}

      # 9️⃣ Create Pull Request for the autofix
      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CREATOR_BOT_TOKEN }}
          branch: autofix-${{ github.run_id }}
          base: ${{ github.event.workflow_run.head_branch }}
          title: "AI Autofix: Resolve CI Failure"
          body: "Automated minimal fix generated from CI logs."
          commit-message: "AI autofix for CI failure"
          delete-branch: true  # Clean up branch after merge

      # 🔍 Debug: Check if PR was created
      - name: Debug PR Output
        run: |
          echo "PR Number: ${{ steps.pr.outputs.pull-request-number }}"
          echo "PR URL: ${{ steps.pr.outputs.pull-request-url }}"
          echo "PR Operation: ${{ steps.pr.outputs.pull-request-operation }}"

      # 🔟 Auto-approve the PR (only if created)
      - name: Auto approve PR
        if: steps.pr.outputs.pull-request-number != ''
        uses: hmarr/auto-approve-action@v4
        with:
          pull-request-number: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GITHUB_TOKEN: ${{ secrets.APPROVE_BOT_TOKEN }}

      # 1️⃣1️⃣ Merge the PR safely
      - name: Merge PR
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --merge --delete-branch --admin
        env:
          GH_TOKEN: ${{ secrets.APPROVE_BOT_TOKEN }}
