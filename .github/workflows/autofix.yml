name: AI Autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      !contains(github.event.workflow_run.head_branch, 'autofix')
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout at the failed commit (DON'T create branch yet)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.CREATOR_BOT_TOKEN }}
          fetch-depth: 0

      # 2️⃣ Prepare logs folder
      - name: Prepare logs folder
        run: |
          mkdir -p ./logs
          rm -f ./logs/*

      # 3️⃣ Download CI logs
      - name: Download CI logs
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
            -n failure-logs \
            -D ./logs
        env:
          GH_TOKEN: ${{ secrets.CREATOR_BOT_TOKEN }}

      # 4️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 6️⃣ Run autofix script
      - name: Generate AI fix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/autofix.py ./logs/ci.log
        continue-on-error: true

      # 7️⃣ Check for changes
      - name: Check for changes
        id: changes
        run: |
          # Remove backup files from being committed
          rm -f **/*.backup
          
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected:"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️ No changes to commit"
          fi

      # 8️⃣ Create Pull Request (handles branch creation, commit, push)
      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CREATOR_BOT_TOKEN }}
          branch: autofix-${{ github.run_id }}
          base: ${{ github.event.workflow_run.head_branch }}
          title: "🤖 AI Autofix: Resolve CI Failure"
          body: |
            ## 🤖 Automated Fix
            
            This PR contains automated fixes for the failed CI run.
            
            **Details:**
            - Failed workflow: ${{ github.event.workflow_run.html_url }}
            - Source branch: `${{ github.event.workflow_run.head_branch }}`
            - Run ID: `${{ github.run_id }}`
            
            **Changes:**
            Pattern-based autofix detected and corrected the failing test.
            
            ### Files Modified:
            - `app/calc.py` - Fixed subtract function logic
            
            Please review before merging.
          commit-message: "🤖 Autofix: Apply AI-generated fix"
          committer: "CI Autofix Bot <ci-bot@users.noreply.github.com>"
          author: "CI Autofix Bot <ci-bot@users.noreply.github.com>"
          delete-branch: true

      # 9️⃣ Debug output
      - name: Debug PR Output
        if: always()
        run: |
          echo "=========================================="
          echo "PR Creation Result:"
          echo "=========================================="
          echo "PR Number: ${{ steps.pr.outputs.pull-request-number }}"
          echo "PR URL: ${{ steps.pr.outputs.pull-request-url }}"
          echo "PR Operation: ${{ steps.pr.outputs.pull-request-operation }}"
          echo "=========================================="

      # 🔟 Auto-approve
      - name: Auto approve PR
        if: steps.pr.outputs.pull-request-number != ''
        uses: hmarr/auto-approve-action@v4
        with:
          pull-request-number: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GITHUB_TOKEN: ${{ secrets.APPROVE_BOT_TOKEN }}

      # 1️⃣1️⃣ Wait for approval to register
      - name: Wait for approval
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          echo "Waiting for approval to register..."
          sleep 5

      # 1️⃣2️⃣ Merge PR
      - name: Merge PR
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          PR_NUM="${{ steps.pr.outputs.pull-request-number }}"
          echo "🔄 Attempting to merge PR #$PR_NUM"
          
          if gh pr merge "$PR_NUM" --merge --delete-branch --admin; then
            echo "✅ PR #$PR_NUM merged successfully"
          else
            echo "⚠️ Failed to merge PR #$PR_NUM"
            echo "Check PR status:"
            gh pr view "$PR_NUM"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.APPROVE_BOT_TOKEN }}