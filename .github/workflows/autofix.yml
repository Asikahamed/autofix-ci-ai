name: AI Autofix

# Triggered after CI workflow completes
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    # Run only if CI failed and not already on an autofix branch
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      !contains(github.event.workflow_run.head_branch, 'autofix')
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo at the head commit of CI run
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.CREATOR_BOT_TOKEN }}
          fetch-depth: 0

      # 2️⃣ Create a dedicated autofix branch
      - name: Create Autofix Branch
        run: git checkout -b autofix-${{ github.run_id }}

      # 3️⃣ Prepare logs folder
      - name: Prepare logs folder
        run: |
          mkdir -p ./logs
          rm -f ./logs/*

      # 4️⃣ Download the CI log artifact
      - name: Download CI logs
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
            -n failure-logs \
            -D ./logs
        env:
          GH_TOKEN: ${{ secrets.CREATOR_BOT_TOKEN }}

      # 5️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 6️⃣ Install project dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 7️⃣ Run AI autofix script
      - name: Generate AI fix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python .github/scripts/autofix.py ./logs/ci.log
        continue-on-error: true

      # 8️⃣ Check if any changes were made
      - name: Check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Autofix made changes"
            git status --short
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️ No changes made by autofix"
          fi

      # 9️⃣ Create PR (this handles commit + push automatically)
      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CREATOR_BOT_TOKEN }}
          branch: autofix-${{ github.run_id }}
          base: ${{ github.event.workflow_run.head_branch }}
          title: "🤖 AI Autofix: Resolve CI Failure"
          body: |
            ## 🤖 Automated Fix
            
            This PR contains automated fixes for the failed CI run.
            
            **Details:**
            - Failed workflow: ${{ github.event.workflow_run.html_url }}
            - Source branch: `${{ github.event.workflow_run.head_branch }}`
            - Run ID: `${{ github.run_id }}`
            
            **Changes:**
            The AI analyzed the CI logs and applied minimal fixes to resolve the failures.
            
            Please review the changes before merging.
          commit-message: "🤖 Autofix: Apply AI-generated fix"
          committer: "CI Autofix Bot <ci-bot@users.noreply.github.com>"
          author: "CI Autofix Bot <ci-bot@users.noreply.github.com>"

      # 🔍 Debug PR Output
      - name: Debug PR Output
        if: always()
        run: |
          echo "PR Number: ${{ steps.pr.outputs.pull-request-number }}"
          echo "PR URL: ${{ steps.pr.outputs.pull-request-url }}"
          echo "PR Operation: ${{ steps.pr.outputs.pull-request-operation }}"

      # 🔟 Auto-approve (only if PR created)
      - name: Auto approve PR
        if: steps.pr.outputs.pull-request-number != ''
        uses: hmarr/auto-approve-action@v4
        with:
          pull-request-number: ${{ steps.pr.outputs.pull-request-number }}
        env:
          GITHUB_TOKEN: ${{ secrets.APPROVE_BOT_TOKEN }}

      # 1️⃣1️⃣ Wait for approval to register
      - name: Wait for approval
        if: steps.pr.outputs.pull-request-number != ''
        run: sleep 5

      # 1️⃣2️⃣ Merge PR
      - name: Merge PR
        if: steps.pr.outputs.pull-request-number != ''
        run: |
          echo "Merging PR #${{ steps.pr.outputs.pull-request-number }}"
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} \
            --merge \
            --delete-branch \
            --admin || echo "⚠️ Merge failed"
        env:
          GH_TOKEN: ${{ secrets.APPROVE_BOT_TOKEN }}