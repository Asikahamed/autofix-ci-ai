name: AI Autofix

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  autofix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.CREATOR_BOT_TOKEN }}

      - name: Download failure logs
        uses: actions/download-artifact@v4
        with:
          name: failure-logs
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate AI fix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/scripts/autofix.py pytest.log

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CREATOR_BOT_TOKEN }}
          branch: autofix-${{ github.run_id }}
          base: main
          title: "AI Autofix: Resolve CI Failure"
          body: "Automated minimal fix generated from CI logs."

      - name: Auto approve PR
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.APPROVE_BOT_TOKEN }}

      - name: Merge PR
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --merge --delete-branch --admin
        env:
          GH_TOKEN: ${{ secrets.APPROVE_BOT_TOKEN }}
